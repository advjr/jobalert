<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobAlert</title>
  <meta name="description" content="Job leads and social posts matched to my skills, with direct contacts and AI-drafted offers.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5fd1'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>try { const t = localStorage.getItem('jobalert.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="dash">
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark"><svg><use href="#i-check"/></svg></span><span>JobAlert</span></a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="jobs"><svg><use href="#i-briefcase"/></svg><span>Jobs</span><span class="n" id="n-jobs"></span></button>
      <button class="tab" role="tab" data-tab="social"><svg><use href="#i-chat"/></svg><span>Social posts</span><span class="n" id="n-social"></span></button>
      <button class="tab" role="tab" data-tab="pipeline"><svg><use href="#i-layers"/></svg><span>Pipeline</span><span class="n" id="n-pipeline"></span></button>
    </nav>
    <div class="top-actions">
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search title, company or skill">
      </label>
      <button id="btn-refresh" class="icon-btn" title="Pull fresh posts" aria-label="Refresh"><svg><use href="#i-refresh"/></svg></button>
      <button id="btn-theme" class="icon-btn" aria-label="Switch theme"></button>
    </div>
  </header>

  <div class="toolbar">
    <label class="country-pick" title="Where the jobs are">
      <svg><use href="#i-globe"/></svg>
      <select id="country" aria-label="Country"></select>
    </label>
    <label class="switch" id="anywhere-wrap"><input type="checkbox" id="anywhere"><span class="track"></span>Worldwide remote too</label>
    <div class="seg" id="pipeline-seg" hidden></div>
    <div class="seg" id="platform-seg" hidden></div>
    <div id="summary" class="summary"></div>
    <div class="toolbar-end">
      <select id="sort" aria-label="Sort by">
        <option value="score">Best match</option>
        <option value="newest">Newest</option>
        <option value="contact">Easiest to contact</option>
        <option value="pay">Pay listed first</option>
      </select>
      <button class="btn" id="btn-filters"><svg><use href="#i-filter"/></svg><span>Filters</span><span class="badge" id="filter-count" hidden></span></button>
      <button class="icon-btn" id="btn-export" title="Download this list as CSV" aria-label="Export CSV"><svg><use href="#i-download"/></svg></button>
    </div>
  </div>

  <section class="social-panel" id="social-panel" hidden>
    <div class="sp-card">
      <div class="sp-text">
        <h2>Posts from people looking for your services</h2>
        <p id="scan-note" class="muted"></p>
      </div>
      <button class="btn btn-primary" id="btn-scan"><svg><use href="#i-spark"/></svg><span>Scan with AI</span></button>
    </div>
    <div class="sp-card sp-quick">
      <div class="sp-text">
        <h2>Search the platforms yourself</h2>
        <p class="muted">Opens each platform's own search in a new tab, using your logins.</p>
      </div>
      <div class="quick-row">
        <select id="quick-q" aria-label="Looking for"></select>
        <div class="quick-links" id="quick-links"></div>
      </div>
    </div>
  </section>

  <main class="grid" id="grid" aria-live="polite"></main>

  <aside class="sheet" id="sheet" aria-label="Filters" aria-hidden="true">
    <div class="sheet-head">
      <strong>Filters</strong>
      <button class="icon-btn" id="btn-close-sheet" aria-label="Close filters"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="sheet-body">
      <section class="fgroup">
        <h3>How you can reach them</h3>
        <div class="chips" data-filter="contact">
          <button class="chip" data-value="email"><svg><use href="#i-mail"/></svg>Email found</button>
          <button class="chip" data-value="apply"><svg><use href="#i-link"/></svg>Apply link</button>
          <button class="chip" data-value="signup"><svg><use href="#i-lock"/></svg>Needs sign-up</button>
        </div>
      </section>
      <section class="fgroup">
        <h3>Job type</h3>
        <div class="chips" data-filter="types">
          <button class="chip" data-value="Project">Project</button>
          <button class="chip" data-value="Contract">Contract</button>
          <button class="chip" data-value="Part-time">Part-time</button>
          <button class="chip" data-value="Full-time">Full-time</button>
          <button class="chip" data-value="Unspecified">Not stated</button>
        </div>
      </section>
      <section class="fgroup">
        <h3>Minimum match <output id="minScoreOut"></output></h3>
        <input type="range" id="minScore" min="0" max="90" step="5">
        <div class="range-legend"><span>Anything</span><span>Great fits only</span></div>
      </section>
      <section class="fgroup">
        <h3>More</h3>
        <label class="check"><input type="checkbox" id="locOnly"> Hide jobs I can't do from the Philippines</label>
        <label class="check"><input type="checkbox" id="hasPay"> Pay is listed</label>
        <label class="check"><input type="checkbox" id="newOnly"> New since my last visit</label>
        <label class="select-row">Posted within
          <select id="days">
            <option value="2">2 days</option>
            <option value="7">7 days</option>
            <option value="14">14 days</option>
            <option value="35">30 days</option>
          </select>
        </label>
      </section>
      <section class="fgroup">
        <h3>Sources</h3>
        <div id="sources" class="sources"></div>
      </section>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-block" id="btn-reset">Reset filters</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js" type="module"></script>
</body>
</html>
